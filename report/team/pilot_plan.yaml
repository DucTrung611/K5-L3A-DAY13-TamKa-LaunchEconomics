# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# ===== VÙNG KHÁNH: D1, đánh đổi, mọi trường YAML trừ stop_rules =====
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48 -> 3.103 yêu cầu mỗi nhóm -> 42 nhân viên mỗi nhóm (tổng 84 > 40: không đủ người)
#   c) 20 nhân viên mỗi nhóm: trần hiệu dụng c/ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt mức chênh 5 điểm)
#   d) 6 depot mỗi nhóm: trần hiệu dụng c/ICC = 6 / 0,02 = 300 < 1.251 (không đạt)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu/người (DE = 6,96)
#
# ===== VÙNG HÙNG: năm câu D2 =====
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên nhóm đối chứng xử lý song song trong cùng các tuần và cùng depot với nhóm dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot để cân bằng đặc thù từng kho.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên chia sẻ gợi ý/câu trả lời trong cùng depot; giảm bằng cấp quyền dùng trợ lý theo staff_id và log lượt mở trợ lý.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính (dong_trong_24h_khong_mo_lai_7_ngay), ngưỡng MDE, luật dừng và ngày quyết định chốt trước khi bật pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đạt đúng 20 cụm (nhân viên) mỗi nhóm (so với phương án depot chỉ có 6 cụm/nhóm).
#
# ===== VÙNG KHÁNH =====
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận tăng MDE từ 5 điểm lên 6 điểm (cần 859 yêu cầu/nhóm, m >= 299 với 20 nhân viên mỗi nhóm). Nếu tác động thật chỉ là 5 điểm, power giảm từ 0,80 xuống còn khoảng 0,64 (64,2%).

# ===== VÙNG TRUNG: tỉ lệ mở lại (số do Hùng tính ở E1) + stop_rules =====
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại (đợt chạy thử): 4,25% trên toàn bộ (51/1.200); 3,97% trong phạm vi noi_dia + hang_nang (39/982).
#   Ngưỡng tuyệt đối 3% sẽ dừng pilot ngay tuần đầu (3,97% > 3%) → dùng ngưỡng TƯƠNG ĐỐI so với nhóm đối chứng
#   (chênh ≥ 2 điểm) kèm trần tuyệt đối 6% (≈ 1,5 lần mức 3,97% hiện tại), cộng 1 ca hoàn trùng tiền là dừng.
#   Ngưỡng chi phí 8.000 đ/việc thành công [simulated]: gốc trong phạm vi 3.414 đ, + cố định ở nửa khối lượng 5.784 đ (A4);
#   xem lại 100% đẩy lên 11.743 đ = 0,98× (B4) → vượt 8.000 đ nghĩa là đã mất phần lớn khoản tiết kiệm.
#   Ngưỡng bỏ qua gợi ý 40%: hiện tại 27,12% toàn bộ (21,1% trong phạm vi) → còn khoảng 13 điểm dư trước khi dừng.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (chi phí mỗi việc 0,22× và 0,69× so với 12.000 đ, simulated); loại bỏ quoc_te (1,88×) và doi_tac (0,85×)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng làm cùng thời gian, cùng 12 depot"
    spillover_risk: "Nhân viên có thể chia sẻ câu trả lời; giảm thiểu bằng cấp quyền theo tài khoản cá nhân và log lượt truy cập theo staff_id"
    predeclared: "Chỉ số chính, ngưỡng dừng, thời điểm đánh giá chốt trước khi bấm chạy pilot"
  # ===== VÙNG TRUNG: stop_rules =====
  stop_rules:
    # an toàn: so với đối chứng + trần tuyệt đối (hiện tại 3,97% trong phạm vi)
    - "NẾU tỉ lệ mo_lai_trong_7_ngay của nhóm trợ lý cao hơn nhóm đối chứng từ 2 điểm trở lên, hoặc vượt 6%, hoặc có từ 1 ca hoàn trùng tiền TRONG 3 ngày làm việc liên tiếp THÌ Giám đốc vận hành bấm cờ tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà 20 trace mở lại trong 2 ngày KHÔNG THÌ không được sang bước rollout tiếp theo"
    # chi phí: ngưỡng 8.000 đ/việc thành công [simulated], đo bằng phút thật từ event
    - "NẾU chi phí mỗi việc thành công của nhóm trợ lý (token + tool + phút xem lại và làm lại đo thật) vượt 8.000 đ, hoặc tỉ lệ làm lại vượt 7% (đợt chạy thử 4,9% trong phạm vi) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và đặt giới hạn 2 lần chạy trong 3 ngày làm việc KHÔNG THÌ không được giữ hang_nang trong pilot và không được mở rộng sang depot mới"
    # mức độ sử dụng: bỏ qua gợi ý (hiện tại 27,12%)
    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ trên số được xem lại) vượt 40%, hoặc dưới 50% yêu cầu trong phạm vi của nhóm trợ lý được mở bằng trợ lý TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên nhóm trợ lý và báo cáo nguyên nhân trong 3 ngày làm việc KHÔNG THÌ không được chuyển bước rollout và không được giảm tỉ lệ xem lại"
  # ===== VÙNG KHÁNH: các trường còn lại =====
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trên dashboard quản trị trong vòng 30 phút; toàn bộ yêu cầu chuyển về luồng nhân viên tự xử lý truyền thống"
  decision_date: "2027-01-05"
  simulated_inputs: ["phut_xem_lai_simulated", "phut_lam_lai_simulated", "chi_phi_moi_viec_thanh_cong"]
